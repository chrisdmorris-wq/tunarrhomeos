name: Build Tunarr Home Assistant OS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push amd64
        uses: docker/build-push-action@v5
        with:
          context: ./tunarr
          file: ./tunarr/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tunarrhomeos-amd64:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest
      
      - name: Build and Push aarch64
        uses: docker/build-push-action@v5
        with:
          context: ./tunarr
          file: ./tunarr/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tunarrhomeos-aarch64:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base:latest
